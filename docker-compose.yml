services:
  neo4j:
    image: neo4j:5.26-community
    container_name: math-trainer-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      # NEO4J_AUTH is neo4j/<password>; override with NEO4J_PASSWORD in your env.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
